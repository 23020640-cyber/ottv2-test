<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OTTv2 — Đấu trường 4 bàn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    /* Cùng bảng màu với index.html (Bài 1) */
    :root {
      --bg: #0b1220;
      --panel: rgba(15, 23, 42, .78);
      --p1: #14b8a6;
      --p2: #f43f5e;
      --goal: #fbbf24;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Be Vietnam Pro", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(20,184,166,.18), transparent 50%),
        radial-gradient(900px 500px at 100% 110%, rgba(244,63,94,.16), transparent 50%),
        var(--bg);
    }
    header {
      display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
      padding: 12px 16px;
    }
    h1 { margin: 0 auto 0 0; font-size: 1.15rem; letter-spacing: .04em; }
    h1 span { color: var(--p1); }
    header a { color: var(--muted); font-size: 14px; }
    #player-name {
      padding: 7px 10px; border-radius: 10px; width: 180px;
      border: 1px solid rgba(255,255,255,.12); background: var(--panel);
      color: var(--text); font: inherit;
    }

    /* 4 bàn ở 4 góc */
    .arena {
      display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
      padding: 0 16px 16px;
    }
    .table {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px; padding: 12px;
      display: flex; flex-direction: column; gap: 8px;
      min-width: 0;
    }
    .t-head { font-size: 15px; }
    .t-seats, .t-counts, .t-actions {
      display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .seat.P1 { color: var(--p1); }
    .seat.P2 { color: var(--p2); }
    .seat.me { font-weight: 800; }
    .seat.empty { color: var(--muted); }
    .t-status { font-size: 13px; color: var(--muted); min-height: 1.3em; }
    .t-status.go { color: var(--p1); font-weight: 600; }
    .t-status.win { color: var(--goal); font-weight: 600; }
    .t-error { color: var(--p2); }
    .t-counts { font-size: 14px; }
    .t-counts .P1 { color: var(--p1); } .t-counts .P2 { color: var(--p2); }

    button {
      border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer;
      font: inherit; font-size: 13px; font-weight: 600;
      background: #1d4ed8; color: #fff;
    }
    button.seat { background: rgba(255,255,255,.08); }
    button.seat.P1 { color: var(--p1); } button.seat.P2 { color: var(--p2); }
    button:focus-visible { outline: 2px solid var(--goal); outline-offset: 2px; }

    /* Bàn cờ: cùng tên class với Bài 1 */
    .t-board {
      display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px;
      padding: 6px; background: #0f172a; border-radius: 12px;
      width: min(100%, calc(50vh - 150px)); min-width: 240px; margin: 0 auto;
    }
    .cell {
      aspect-ratio: 1; border: 0; padding: 0; border-radius: 6px;
      display: grid; place-items: center; position: relative; cursor: pointer;
    }
    .cell.light { background: #334155; }
    .cell.dark { background: #1e293b; }
    .cell.goal { box-shadow: inset 0 0 0 2px var(--goal); }
    .cell.last { filter: brightness(1.3); }
    .cell.selected { outline: 2px solid #fff; outline-offset: -2px; }
    .cell.valid::after {
      content: ""; width: 26%; height: 26%; border-radius: 50%;
      background: rgba(20,184,166,.85);
    }
    .cell.attack::after {
      content: ""; position: absolute; width: 70%; height: 70%;
      border: 2px solid rgba(244,63,94,.95); border-radius: 50%;
    }
    .piece {
      width: 80%; height: 80%; border-radius: 50%;
      display: grid; place-items: center; z-index: 1;
      font-size: clamp(11px, 1.6vw, 20px);
      box-shadow: 0 4px 10px rgba(0,0,0,.35);
    }
    .piece.P1 { background: radial-gradient(circle at 30% 25%, #5eead4, #0f766e); }
    .piece.P2 { background: radial-gradient(circle at 30% 25%, #fda4af, #9f1239); }

    /* Chế độ trình chiếu (arena.html?view=1): bàn cờ to hơn, ẩn ô nhập tên */
    .view-only #player-name, .view-only header a { display: none; }
    .view-only .t-board { width: min(100%, calc(50vh - 110px)); }
    .view-only .cell { cursor: default; }

    @media (max-width: 1000px) {
      .arena { grid-template-columns: 1fr; }
      .t-board { width: min(100%, 520px); }
      .piece { font-size: clamp(14px, 4vw, 24px); }
    }
  </style>
</head>
<body>
  <header>
    <h1>OTT<span>v2</span> — Đấu trường 4 bàn</h1>
    <input id="player-name" placeholder="Nhập tên trước khi ngồi" maxlength="20" />
    <a href="./index.html">Chế độ 2 người (Bài 1)</a>
    <a href="./arena.html?view=1" target="_blank">Chế độ trình chiếu</a>
  </header>

  <main class="arena">
    <section class="table" id="board-1"></section>
    <section class="table" id="board-2"></section>
    <section class="table" id="board-3"></section>
    <section class="table" id="board-4"></section>
  </main>

  <script type="module" src="./arenaNetwork.js"></script>
</body>
</html>
